# docker-compose.yml (version field dihapus karena sudah obsolete di Docker Compose v2+)

services:
  # 1. Komputer Mini untuk Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: axon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordnabilaesd
      POSTGRES_DB: tumordb
    ports:
      # Membuka port 5433 di luar agar tidak bentrok dengan Postgres bawaan laptop
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Komputer Mini untuk FastAPI dan AI
  fastapi-backend:
    build: .
    container_name: axon-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    # Inference berjalan di CPU (torch CPU-only) sehingga GPU tidak diperlukan

  # 3. Redis broker untuk Celery
  redis:
    image: redis:alpine
    container_name: axon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 4. Celery worker untuk pemrosesan AI asinkron
  celery-worker:
    build: .
    container_name: axon-celery
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped

# Mendefinisikan tempat penyimpanan permanen untuk database
volumes:
  postgres_data: